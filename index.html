<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WhoFoss</title>

    <style>
        body {
            background: #0d1117;
            color: #c9d1d9;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }

        .card {
            max-width: 600px;
            margin: auto;
            background: #161b22;
            padding: 30px;
            border-radius: 15px;
            border: 1px solid #30363d;
        }

        h1 {
            color: #58a6ff;
        }

        h2 {
            color: #c9d1d9;
        }

        .status {
            color: #3fb950;
            font-weight: bold;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #238636;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .button:hover {
            background: #2ea043;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>WhoFoss</h1>

    <h2>GitHub Pages Test</h2>

    <p>
        Esta é uma página de teste hospedada utilizando GitHub Pages.
    </p>

    <p>
        Status:
        <span class="status">Online</span>
    </p>

    <hr>

    <h3>Projetos</h3>

    <p>
        LineageOS + MicroG<br>
        Scanner ADB<br>
        Android Tools
    </p>

    <a class="button" href="https://github.com">
        GitHub
    </a>

</div>

</body>
</html>
